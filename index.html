<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-title" content="КМ·Инженер">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>КМ·Инженер 13.0</title>
<link rel="preconnect" href="https://yxopbjmwgbbncxipeynb.supabase.co">
<link rel="dns-prefetch" href="https://yxopbjmwgbbncxipeynb.supabase.co">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f2f5fa;--bg2:#e8edf5;
  --card:rgba(255,255,255,.72);--card-solid:#fff;--card2:rgba(233,239,247,.8);--card3:rgba(215,226,240,.85);
  --sep:rgba(60,90,140,.14);--sep2:rgba(60,90,140,.08);
  --label:#0c1b33;--label2:rgba(12,27,51,.66);--label3:rgba(12,27,51,.38);
  --blue:#0a84ff;--blue2:#0066dd;--green:#28b36b;--orange:#ff9f0a;--red:#ff3b30;--gray:#8fa3bd;--violet:#8e6cf0;
  --sat:env(safe-area-inset-top,0);--sab:env(safe-area-inset-bottom,0);
  --grad:linear-gradient(135deg,#5fc9f5 0%,#0a84ff 50%,#0055d4 100%);
  --grad-warm:linear-gradient(135deg,#ffb84d 0%,#ff6b35 100%);
  --grad-violet:linear-gradient(135deg,#8e6cf0 0%,#5c3fd4 100%);
  --grad-green:linear-gradient(135deg,#35d07f 0%,#1a8f52 100%);
  --glass:blur(24px);--sh-sm:0 1px 3px rgba(10,30,60,.06);--sh-md:0 4px 20px rgba(10,30,60,.08);--sh-lg:0 10px 40px rgba(10,30,60,.12);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#040914;--bg2:#080f1e;
  --card:rgba(11,22,38,.6);--card-solid:#0b1626;--card2:rgba(18,32,58,.7);--card3:rgba(26,47,82,.75);
  --sep:rgba(120,160,220,.14);--sep2:rgba(120,160,220,.06);
  --label:#eef4fc;--label2:rgba(238,244,252,.68);--label3:rgba(238,244,252,.38);--gray:#6f83a3;
}}
[data-theme=dark]{--bg:#040914;--bg2:#080f1e;--card:rgba(11,22,38,.6);--card-solid:#0b1626;--card2:rgba(18,32,58,.7);--card3:rgba(26,47,82,.75);--sep:rgba(120,160,220,.14);--sep2:rgba(120,160,220,.06);--label:#eef4fc;--label2:rgba(238,244,252,.68);--label3:rgba(238,244,252,.38);--gray:#6f83a3}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;color:var(--label);-webkit-font-smoothing:antialiased;background:var(--bg);position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(ellipse 800px 600px at 20% 0%,rgba(95,201,245,.18),transparent 60%),
  radial-gradient(ellipse 700px 500px at 80% 30%,rgba(142,108,240,.12),transparent 60%),
  radial-gradient(ellipse 900px 700px at 50% 100%,rgba(10,132,255,.1),transparent 60%);
  pointer-events:none}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{background:none;border:0;cursor:pointer}
.disp{font-family:"Russo One",sans-serif;font-weight:400;letter-spacing:.02em}
::-webkit-scrollbar{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes slideInR{from{transform:translateX(100%)}to{transform:none}}
@keyframes slideInL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{50%{opacity:.4}}
@keyframes recPulse{0%,100%{opacity:1}50%{opacity:.4}}
.press{transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s}.press:active{transform:scale(.96)}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.splash{position:absolute;inset:0;background:linear-gradient(160deg,#031a3d,#02070f 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000;padding:24px}
.splash .logo{width:110px;height:110px;border-radius:28px;background:var(--grad);display:grid;place-items:center;margin-bottom:24px;animation:pop .6s;box-shadow:0 20px 60px rgba(10,132,255,.4)}
.splash .logo svg{width:60px;height:60px;stroke:#fff;fill:none;stroke-width:1.8}
.splash h1{font-family:"Russo One";font-size:32px;color:#fff;margin-bottom:8px;letter-spacing:.02em}
.splash p{color:rgba(255,255,255,.6);font-size:13px;margin-bottom:40px;text-align:center}
.auth{position:absolute;inset:0;z-index:800;display:flex;flex-direction:column;padding:calc(24px + var(--sat)) 24px calc(24px + var(--sab));overflow-y:auto}
.auth h2{font-family:"Russo One";font-size:30px;margin-bottom:6px;letter-spacing:.02em}
.auth .sub{color:var(--label2);font-size:14px;margin-bottom:20px}
.sync-badge{display:flex;align-items:center;gap:8px;border-radius:12px;padding:11px 14px;font-size:13px;font-weight:600;margin-bottom:18px;backdrop-filter:var(--glass);background:var(--card)}
.sync-badge.on{border:1px solid rgba(40,179,107,.3);color:var(--green)}
.sync-badge.off{border:1px solid rgba(255,159,10,.3);color:var(--orange)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--label2);margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--sep);color:var(--label);padding:13px 15px;border-radius:12px;outline:none;font-size:15px;transition:border-color .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue)}
.check{display:flex;gap:10px;font-size:13px;color:var(--label2);margin:16px 0;line-height:1.4}
.check input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--blue)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;font-size:15px;font-weight:600;min-height:50px;transition:all .2s}
.btn.b{background:var(--grad);color:#fff;box-shadow:0 6px 20px rgba(10,132,255,.35)}
.btn.v{background:var(--grad-violet);color:#fff;box-shadow:0 6px 20px rgba(142,108,240,.35)}
.btn.g{background:var(--grad-green);color:#fff;box-shadow:0 6px 20px rgba(40,179,107,.35)}
.btn.w{background:var(--grad-warm);color:#fff;box-shadow:0 6px 20px rgba(255,159,10,.35)}
.btn.card{background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--sep);color:var(--label)}
.btn.full{width:100%}
.btn.sm{padding:9px 14px;font-size:13px;min-height:36px;border-radius:11px;width:auto}
.err{background:rgba(255,59,48,.12);color:var(--red);padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;border:1px solid rgba(255,59,48,.2)}
.auth-link{text-align:center;margin-top:18px;font-size:13px;color:var(--label2)}
.auth-link a{color:var(--blue);font-weight:600}
.main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.view{flex:1;overflow-y:auto;padding:calc(10px + var(--sat)) 16px calc(92px + var(--sab));display:none}
.view.on{display:block;animation:fade .25s}
.large-title{font-size:36px;font-weight:800;line-height:1.05;padding:calc(14px + var(--sat)) 16px 8px;letter-spacing:-.02em}
.hdr{display:flex;align-items:center;gap:10px;padding:8px 16px 12px}
.hdr-btn{width:42px;height:42px;border-radius:50%;background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--sep2);display:grid;place-items:center;position:relative;flex:none;box-shadow:var(--sh-sm);transition:transform .15s}
.hdr-btn:active{transform:scale(.94)}
.hdr-btn svg{width:20px;height:20px;stroke:var(--label);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hdr-btn .hb{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;box-shadow:0 2px 6px rgba(255,59,48,.4)}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;padding:8px 6px calc(8px + var(--sab));background:var(--card);backdrop-filter:var(--glass);border-top:1px solid var(--sep2);box-shadow:0 -4px 20px rgba(0,0,0,.04)}
.tbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--gray);font-size:10px;font-weight:600;padding:5px 0;position:relative;border-radius:12px;transition:color .2s}
.tbtn::after{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:0;height:3px;border-radius:2px;background:var(--blue);transition:width .25s}
.tbtn.on::after{width:20px}
.tbtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tbtn.on{color:var(--blue)}
.tbtn .tb{position:absolute;top:-2px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:9px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center}
.card,.scard,.tcard,.telem-card,.hcard,.stat,.idea-card,.news-card,.permit-card,.route-step,.chart-card,.org-card,.vks-card,.notif-group{box-shadow:var(--sh-sm);border:1px solid var(--sep2)}
.card{background:var(--card);backdrop-filter:var(--glass);border-radius:18px;overflow:hidden;margin-bottom:14px;transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:var(--sh-md)}
.grow{display:flex;align-items:center;gap:12px;padding:14px;position:relative;min-height:48px;text-align:left;width:100%;transition:background .15s}
.grow:active{background:var(--card2)}
.grow+.grow::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--sep2)}
.ava{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;position:relative;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.ava.sm{width:32px;height:32px;font-size:11px}
.ava.lg{width:80px;height:80px;font-size:26px;box-shadow:0 8px 24px rgba(10,132,255,.3)}
.ava.b1{background:var(--grad)}
.ava.b2{background:linear-gradient(150deg,#0a84ff,#0055d4)}
.ava.b3{background:var(--grad-green)}
.ava.b4{background:var(--grad-violet)}
.ava.b5{background:linear-gradient(150deg,#0aa9d6,#067a9c)}
.ava.b6{background:var(--grad-warm)}
.ava.gray{background:var(--card3);color:var(--label)}
.ava-stack{display:flex;margin-left:-8px}
.ava-stack .ava{margin-left:-8px;border:2.5px solid var(--card-solid)}
.ava-stack .ava:first-child{margin-left:0}
.ava-stack .more{background:var(--card3);color:var(--label);font-size:10px;font-weight:700}
.pres{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;border:2.5px solid var(--card-solid)}
.pres.on{background:var(--green);box-shadow:0 0 8px var(--green)}.pres.away{background:var(--orange)}.pres.off{background:var(--gray)}
.tag{display:inline-flex;align-items:center;font-size:10px;font-weight:700;padding:3px 9px;border-radius:7px;white-space:nowrap;letter-spacing:.02em;text-transform:uppercase}
.tg-r{background:rgba(255,59,48,.14);color:var(--red)}.tg-g{background:rgba(40,179,107,.14);color:var(--green)}
.tg-o{background:rgba(255,159,10,.16);color:var(--orange)}.tg-c{background:rgba(10,169,214,.14);color:#0aa9d6}
.tg-b{background:rgba(10,132,255,.14);color:var(--blue)}.tg-v{background:rgba(142,108,240,.14);color:var(--violet)}
.tgl{width:51px;height:31px;border-radius:16px;background:rgba(120,140,170,.35);position:relative;transition:.25s;flex:none}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tgl.on{background:var(--blue)}.tgl.on::after{left:22px}
.selc{width:26px;height:26px;border-radius:50%;border:2px solid var(--gray);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex:none}
.selc.on{background:var(--blue);border-color:var(--blue)}
.gtitle{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--label3);padding:22px 8px 10px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.gtitle a{color:var(--blue);text-decoration:none;font-size:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--sep2);border-radius:14px;padding:11px 14px;margin-bottom:14px}
.search svg{width:16px;height:16px;stroke:var(--gray);fill:none;stroke-width:2;flex:none}
.search input{flex:1;background:none;border:0;outline:none;color:var(--label);font-size:15px}
.empty{text-align:center;color:var(--label3);font-size:13px;padding:30px 10px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--sep2);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad)}
.stat.green::before{background:var(--grad-green)}
.stat.orange::before{background:var(--grad-warm)}
.stat.violet::before{background:var(--grad-violet)}
.stat small{font-size:11px;color:var(--label2);text-transform:uppercase;font-weight:700;letter-spacing:.05em;display:block;margin-bottom:8px}
.stat b{font-family:"Russo One";font-size:26px;letter-spacing:-.02em}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px;margin:4px 0 18px;color:#fff;background:var(--grad);box-shadow:0 20px 60px rgba(10,132,255,.3)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 20%,rgba(255,255,255,.2),transparent 50%),radial-gradient(circle at 10% 90%,rgba(0,85,212,.4),transparent 50%);pointer-events:none}
.hero .live{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.25);backdrop-filter:blur(10px);padding:5px 10px;border-radius:20px;margin-bottom:12px;border:1px solid rgba(255,255,255,.15)}
.hero .live i{width:7px;height:7px;border-radius:50%;background:#7dffb0;animation:pulse 1.8s infinite;box-shadow:0 0 8px #7dffb0}
.hero h3{font-family:"Russo One";font-size:24px;margin-bottom:6px;letter-spacing:.02em;position:relative}
.hero p{font-size:13.5px;color:rgba(255,255,255,.92);max-width:280px;line-height:1.45;position:relative}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:6px 16px 12px;scroll-snap-type:x mandatory}
.hcard{min-width:160px;background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--sep2);border-radius:16px;padding:16px;flex:none;scroll-snap-align:start;box-shadow:var(--sh-sm)}
.hcard small{font-size:10px;color:var(--label2);text-transform:uppercase;font-weight:700;letter-spacing:.05em;display:block;margin-bottom:10px}
.hcard .num{font-family:"Russo One";font-size:28px;letter-spacing:-.02em;margin-bottom:6px}
.chart-card{background:var(--card);backdrop-filter:var(--glass);border-radius:18px;padding:16px;margin-bottom:14px}
.chart-card .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.chart-card .hd b{font-size:15px;font-weight:700;flex:1}
.chart-card .hd small{font-size:11px;color:var(--label2);font-weight:600}
.donut{position:relative;width:120px;height:120px;margin:0 auto}
.donut svg{transform:rotate(-90deg)}
.donut .center{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column}
.donut .center b{font-family:"Russo One";font-size:22px;line-height:1}
.donut .center small{font-size:10px;color:var(--label2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.legend{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500}
.legend-item .sq{width:10px;height:10px;border-radius:3px;flex:none}
.legend-item b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.org-card{background:var(--card);backdrop-filter:var(--glass);border-radius:16px;margin-bottom:12px;overflow:hidden}
.org-card .org-hd{padding:14px 16px;display:flex;align-items:center;gap:10px;background:var(--card2);border-bottom:1px solid var(--sep2)}
.org-card .org-hd b{font-size:14px;font-weight:700;flex:1}
.org-card .org-hd small{font-size:11px;color:var(--label2);font-weight:600}
.org-card .org-hd .cnt{background:var(--blue);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px}
.route-pipeline{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:6px 16px 12px;scroll-snap-type:x mandatory}
.route-step{min-width:160px;flex:none;background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--sep2);border-radius:14px;padding:12px;scroll-snap-align:start;box-shadow:var(--sh-sm);position:relative}
.route-step::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
.route-step.new::before{background:var(--gray)}
.route-step.work::before{background:var(--blue)}
.route-step.review::before{background:var(--orange)}
.route-step.done::before{background:var(--green)}
.route-step b{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--label2);display:block;margin-bottom:8px}
.route-step .cnt{font-family:"Russo One";font-size:28px;letter-spacing:-.02em;margin-bottom:4px}
.route-step .list{font-size:11px;color:var(--label2);line-height:1.4}
.route-step .list div{padding:2px 0;border-top:1px dashed var(--sep2)}
.route-step .list div:first-child{border-top:0}
.chat-hd{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--sep2);border-radius:18px;margin-bottom:14px;box-shadow:var(--sh-sm)}
.chat-hd .ava{width:54px;height:54px;font-size:18px}
.chat-hd b{font-size:17px;font-weight:700;display:block;margin-bottom:2px}
.chat-hd small{font-size:12px;color:var(--label2)}
.chat-msgs{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;flex-direction:column;animation:pop .3s both}
.mrow.me{align-items:flex-end}
.bub{max-width:82%;padding:10px 14px;font-size:15px;line-height:1.42;border-radius:19px;word-break:break-word}
.bub.me{background:var(--grad);color:#fff;border-bottom-right-radius:6px;box-shadow:0 4px 12px rgba(10,132,255,.25)}
.bub.them{background:var(--card);backdrop-filter:var(--glass);border:1px solid var(--sep2);color:var(--label);border-bottom-left-radius:6px}
.bub .tm{display:block;font-size:10px;opacity:.6;margin-top:4px;text-align:right}
.bub .sender{font-size:11px;font-weight:700;opacity:.75;margin-bottom:2px}
.bub.voice{padding:10px}
.bub.voice audio{width:220px;height:36px;display:block}
.bub.file{padding:12px;min-width:200px;max-width:82%}
.bub.file img{max-width:220px;border-radius:12px;display:block;margin-bottom:6px}
.bub.file .file-info{display:flex;align-items:center;gap:10px}
.bub.file .file-icon{width:36px;height:36px;background:rgba(120,150,190,.18);border-radius:8px;display:grid;place-items:center;flex:none}
.bub.file .file-icon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.bub.file .file-name{flex:1;font-weight:600;font-size:13px;word-break:break-all}
.bub.file .file-size{font-size:11px;opacity:.7}
.bub.file a.dl{display:inline-block;margin-top:8px;font-weight:700;font-size:13px;color:var(--blue)}
.bub.me.file a.dl{color:#fff}

  try{
    if(navigator.serviceWorker){navigator.serviceWorker.ready.then(function(reg){reg.showNotification(title,{body:body})}).catch(function(){})}
    else{new Notification(title,{body:body})}
  }catch(e){}
}
function reachable(u){
  var ctl=('AbortController' in window)?new AbortController():null;
  var to=ctl?setTimeout(function(){ctl.abort()},5000):null;
  return fetch(u+'/auth/v1/health',{signal:ctl?ctl.signal:undefined}).then(function(r){
    if(to)clearTimeout(to);
    var ct=r.headers.get('content-type')||'';
    return ct.indexOf('json')>=0;
  }).catch(function(){if(to)clearTimeout(to);return false});
}
async function initSupabase(){
  if(!window.supabase||!window.supabase.createClient){sbOk=false;return}
  var urls=PROXY_URL?[PROXY_URL,SUPA_URL]:[SUPA_URL];
  for(var i=0;i<urls.length;i++){
    var ok=await reachable(urls[i]);
    if(ok){
      try{sb=window.supabase.createClient(urls[i],SUPA_KEY);sbOk=true;connMode=(urls[i]===SUPA_URL?'direct':'proxy')}catch(e){sbOk=false}
      return;
    }
  }
  sbOk=false;
}

  }catch(e){return false}
}

function humErr(m){
  if(!m)return 'Ошибка';
  if(m.indexOf('Load failed')>=0||m.indexOf('Failed to fetch')>=0)return 'Нет соединения.';
  if(m.indexOf('Invalid')>=0)return 'Неверный табельный или пароль';
  if(m.indexOf('already registered')>=0)return 'Этот табельный уже зарегистрирован';
  if(m.indexOf('not confirmed')>=0)return 'Email не подтверждён';
  return m;
}

async function uploadToStorage(blob,path,mime){
  var up=await sb.storage.from(BUCKET).upload(path,blob,{contentType:mime,upsert:false});
  if(up.error)throw up.error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}
async function startRecording(){
  if(state.recording)return;
  try{
    var stream=await navigator.mediaDevices.getUserMedia({audio:true});
    var MR=window.MediaRecorder||window.webkitMediaRecorder;
    state.mediaRecorder=new MR(stream);
    state.audioChunks=[];
    state.mediaRecorder.ondataavailable=function(e){if(e.data&&e.data.size)state.audioChunks.push(e.data)};
    state.mediaRecorder.onstop=async function(){
      stream.getTracks().forEach(function(t){t.stop()});
      var blob=new Blob(state.audioChunks,{type:state.mediaRecorder.mimeType||'audio/webm'});
      state.audioChunks=null;
      if(blob.size<500){showIsland('Слишком короткая','warn','o');return}
      await sendVoice(blob);
    };
    state.mediaRecorder.start();
    state.recording=true;state.recSec=0;
    clearInterval(recTimerIv);
    recTimerIv=setInterval(function(){state.recSec++;var el=$('#recTime');if(el)el.textContent=fmtRec(state.recSec)},1000);
    render();vib(10);
  }catch(e){showIsland('Микрофон недоступен','warn','o')}
}
function stopRecording(){
  if(!state.recording||!state.mediaRecorder)return;
  clearInterval(recTimerIv);
  try{state.mediaRecorder.stop()}catch(e){}
  state.recording=false;render();
}
async function sendVoice(blob){
  if(!state.activeChat||!sbOk)return;
  showIsland('Отправка голосового…','cloud','b',4000);
  try{
    var mime=blob.type||'audio/webm';
    var ext=mime.indexOf('mp4')>=0||mime.indexOf('m4a')>=0?'m4a':'webm';
    var path=state.activeChat.id+'/v'+Date.now()+'_'+uid()+'.'+ext;
    var url=await uploadToStorage(blob,path,mime);
    await sb.from('messages').insert({chat_id:state.activeChat.id,sender_id:state.user.id,sender_name:state.user.name,type:'voice',voice_url:url,time:new Date().toISOString()});
    await sb.from('chats').update({last:'🎤 Голосовое',last_time:new Date().toISOString()}).eq('id',state.activeChat.id);
    vib(10);loadMessages(state.activeChat.id);
  }catch(e){showIsland('Ошибка отправки','warn','o')}
}
async function attachFile(){
  if(!state.activeChat||!sbOk){showIsland('Чат не открыт','warn','o');return}
  var inp=document.createElement('input');
  inp.type='file';
  inp.onchange=async function(){
    var file=inp.files&&inp.files[0];
    if(!file)return;
    if(file.size>50*1048576){showIsland('Файл больше 50 МБ','warn','o');return}
    showIsland('Загрузка: '+file.name,'cloud','b',6000);
    try{
      var path=state.activeChat.id+'/f'+Date.now()+'_'+uid()+'_'+file.name.replace(/[^a-zA-Z0-9.\-_а-яА-Я]/g,'_');
      var url=await uploadToStorage(file,path,file.type||'application/octet-stream');
      await sb.from('messages').insert({chat_id:state.activeChat.id,sender_id:state.user.id,sender_name:state.user.name,type:'file',file_name:file.name,file_size:file.size,file_type:file.type||'',file_url:url,time:new Date().toISOString()});
      await sb.from('chats').update({last:'📎 '+file.name,last_time:new Date().toISOString()}).eq('id',state.activeChat.id);
      vib(10);loadMessages(state.activeChat.id);
    }catch(e){showIsland('Ошибка загрузки','warn','o')}
  };
  inp.click();
}

function genPredictions(){
  var preds=[];
  for(var k in state.telemetry){var v=state.telemetry[k];if(v.status==='warn')preds.push({line:k,name:v.name,prob:clamp(Math.round(v.temp),40,92),reason:'Температура '+Math.round(v.temp)+'°C превышает норму.'})}
  preds.sort(function(a,b){return b.prob-a.prob});
  state.predictions=preds.slice(0,3);
}
function tickTelemetry(){
  for(var k in state.telemetry){
    var v=state.telemetry[k];
    v.temp=clamp(v.temp+(Math.random()*2-1),20,90);
    v.load=clamp(v.load+(Math.random()*4-2),0,100);
    v.history.shift();v.history.push(Math.round(v.load));
    if(v.temp>75&&v.status!=='serv')v.status='warn';
    else if(v.status!=='serv'&&v.temp<70)v.status='ok';
  }
  genPredictions();
  if(state.tab==='factory'&&prodSection==='telemetry'){var view=$('.view.on');if(view){view.innerHTML='';renderFactory(view)}}
}
function buildSpark(data){
  if(!data||!data.length)return[];
  var min=Math.min.apply(null,data),max=Math.max.apply(null,data),range=(max-min)||1;
  var pts=data.map(function(v,i){return[(i/(data.length-1))*120,30-((v-min)/range)*26-2]});
  var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  return[h('polyline',{points:line,fill:'none',stroke:'#0a84ff','stroke-width':'1.5'})];
}

function buildBarChart(data,max){
  var wrap=h('div',{class:'bar-chart'});
  data.forEach(function(v){
    var pct=Math.min(100,(v/max)*100);
    wrap.appendChild(h('div',{class:'bar'+(v===0?' day-off':''),style:{height:pct+'%'},'data-v':v+'ч'}));
  });
  return wrap;
}
function buildDonut(data){
  var total=0;data.forEach(function(d){total+=d.v});
  if(!total)total=1;
  var circumference=2*Math.PI*45;
  var offset=0;
  var circles=[];
  data.forEach(function(d){
    var len=(d.v/total)*circumference;
    circles.push(h('circle',{cx:'60',cy:'60',r:'45',fill:'none',stroke:d.c,'stroke-width':'14','stroke-dasharray':len+' '+(circumference-len),'stroke-dashoffset':-offset}));
    offset+=len;
  });
  return h('div',{class:'donut'},
    h('svg',{viewBox:'0 0 120 120',width:'120',height:'120'},circles),
    h('div',{class:'center'},h('b',{},total),h('small',{},'всего'))
  );
}

  box.innerHTML='';

  var isG=state.activeChat&&state.activeChat.type==='group';
  state.activeChatMessages.forEach(function(m){
    var mine=m.sender_id===myUid;
    var row=h('div',{class:'mrow'+(mine?' me':'')});
    var type=m.type||'text';
    var bub;
    var canDelete=mine&&sbOk;
    var delFn=function(){if(confirm('Удалить?'))deleteMessage(m.id)};
    if(type==='voice'&&m.voice_url){
      bub=h('div',{class:'bub voice'+(mine?' me':' them')});
      if(isG&&!mine)bub.appendChild(h('div',{class:'sender'},m.sender_name||''));
      bub.appendChild(h('audio',{controls:true,preload:'metadata',src:m.voice_url}));
      bub.appendChild(h('span',{class:'tm'},fmtTime(m.time)));
      if(canDelete)bub.addEventListener('click',function(ev){if(ev.target.tagName!=='AUDIO')delFn()});
    }else if(type==='file'&&m.file_url){
      bub=h('div',{class:'bub file'+(mine?' me':' them')});

function urlBase64ToUint8Array(s){var p='='.repeat((4-s.length%4)%4);var b=(s+p).replace(/\-/g,'+').replace(/_/g,'/');var r=window.atob(b);var a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a}
async function subscribePush(force){
  try{
    if(!sbOk||!state.user||String(state.user.id).length<8){showIsland('Пуши: войдите через Supabase','warn','o');return false}
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){showIsland('Откройте с иконки!','warn','o',6000);return false}
    var perm=Notification.permission;
    if(perm==='default'){perm=await Notification.requestPermission()}
    if(perm!=='granted'){showIsland('Разрешение: '+perm,'warn','o',6000);return false}
    var kr=await fetch('https://yxopbjmwgbbncxipeynb.supabase.co/functions/v1/dynamic-handler?getkey=1');
    var kd=await kr.json();
    if(!kd.publicKey)throw new Error('сервер не дал ключ');
    var kb=urlBase64ToUint8Array(kd.publicKey);
    var reg=await Promise.race([navigator.serviceWorker.ready,new Promise(function(_,rj){setTimeout(function(){rj(new Error('SW timeout'))},8000)})]);
    var sub=await reg.pushManager.getSubscription();
    if(!sub||force){
      if(sub){try{await sub.unsubscribe()}catch(e){}}
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:kb});
    }
    var p256dh=btoa(String.fromCharCode.apply(null,new Uint8Array(sub.getKey('p256dh'))));
    var authKey=btoa(String.fromCharCode.apply(null,new Uint8Array(sub.getKey('auth'))));
    await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);
    var r=await sb.from('push_subscriptions').insert({user_id:state.user.id,endpoint:sub.endpoint,p256dh:p256dh,auth:authKey});
    if(r.error)throw r.error;
    showIsland('Подписка активна ✅','bell','g',5000);
    return true;
  }catch(e){
    showIsland('Ошибка пушей: '+String(e.message||e).slice(0,50),'warn','o',6000);
    return false;
  }
}

    osc.start(ctx.currentTime);osc.stop(ctx.currentTime+0.15);
    setTimeout(function(){
      var o2=ctx.createOscillator();var g2=ctx.createGain();
      o2.connect(g2);g2.connect(ctx.destination);
      o2.frequency.value=1320;o2.type='sine';
      g2.gain.setValueAtTime(0.2,ctx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.18);
      o2.start(ctx.currentTime);o2.stop(ctx.currentTime+0.18);
    },120);
  }catch(e){}
}

    state.mediaRecorder=new MR(stream);
    state.audioChunks=[];

    state.mediaRecorder.onstop=async function(){
      stream.getTracks().forEach(function(t){t.stop()});
      var blob=new Blob(state.audioChunks,{type:state.mediaRecorder.mimeType||'audio/webm'});
      state.audioChunks=null;
      if(blob.size<500){showIsland('Слишком короткая запись','warn','o');return}

function buildSpark(data){
  if(!data||!data.length)return[];
  var min=Math.min.apply(null,data),max=Math.max.apply(null,data),range=(max-min)||1;
  var pts=data.map(function(v,i){return[(i/(data.length-1))*120,30-((v-min)/range)*26-2]});
  var line=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' ');
  return[h('polyline',{points:line,fill:'none',stroke:'#0a84ff','stroke-width':'1.5'})];
}

  ));
  view.appendChild(h('div',{class:'gtitle'},'СИНХРОНИЗАЦИЯ'));
  view.appendChild(h('div',{class:'sync-badge '+(sbOk?'on':'off')},(sbOk?'☁️ ':'⚠️ ')+(sbOk?'Supabase подключён':'Supabase не загрузился')));
  view.appendChild(h('div',{class:'gtitle'},'НАСТРОЙКИ'));
  view.appendChild(h('div',{class:'card'},
    h('div',{class:'grow'},h('span',{},'🌓 Тёмная тема'),h('div',{class:'gap'}),
      h('button',{class:'tgl'+(state.theme==='dark'?' on':''),onclick:function(e){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('km-theme',state.theme);saveLocal();e.target.classList.toggle('on');applyTheme()}})),
    h('div',{class:'grow'},h('span',{},'🔔 Звук сообщений'),h('div',{class:'gap'}),
      h('button',{class:'tgl'+(state.sound?' on':''),onclick:function(e){state.sound=!state.sound;localStorage.setItem('km-sound',state.sound?'1':'0');e.target.classList.toggle('on');if(state.sound)playSound()}})),
    h('div',{class:'grow'},h('span',{},'📲 Пуш-уведомления'),h('div',{class:'gap'}),
      h('button',{class:'tgl'+(state.push?' on':''),onclick:async function(e){
        if(!state.push){
          if(!('Notification' in window)){showIsland('Браузер не поддерживает пуш','warn','o');return}
          var p=await Notification.requestPermission();
          if(p!=='granted'){showIsland('Разрешение не выдано','warn','o');return}
          state.push=true;localStorage.setItem('km-push','1');e.target.classList.add('on');
          showIsland('Пуш включены','bell','g');
        }else{
          state.push=false;localStorage.setItem('km-push','0');e.target.classList.remove('on');
        }
      }}))

    h('div',{class:'badge'},h('i',{},'🥇'),'5 лет на заводе'),

    h('div',{class:'badge'},h('i',{},'🎯'),'0 просрочек')
  ));
  view.appendChild(h('button',{class:'btn card full press mt',onclick:doLogout},'Выйти из аккаунта'));
  view.appendChild(h('div',{class:'txt-c cl-gr txt-xs',style:{padding:'20px 0'}},'КМ·Инженер · сборка 10.6 · АО «Коломенский завод»'));
}

function renderPageOverlay(app){
  if(!state.page)return;
  var page=h('div',{class:'page on'});
  if(state.page==='chatroom')renderChatRoom(page);
  else if(state.page==='newtask')renderNewTask(page);
  else if(state.page==='newchat')renderNewChat(page);
  else if(state.page.indexOf('task:')===0)renderTaskDetail(page,state.page.slice(5));
  else if(state.page==='news')renderNews(page);
  else if(state.page==='notif')renderNotif(page);
  else if(state.page==='ai')renderAI(page);
  else if(state.page.indexOf('formula:')===0)renderFormula(page,state.page.slice(8));
  app.appendChild(page);
}
function renderSplash(){
  var app=$('#app');app.innerHTML='';
  app.appendChild(h('div',{class:'splash'},
    h('div',{class:'logo',html:icon('gear')}),
    h('h1',{class:'disp'},'КМ·ИНЖЕНЕР'),
    h('div',{class:'ver'},'сборка 10.6 · Supabase'),
    h('p',{},'Корпоративное приложение АО «Коломенский завод»'),
    h('div',{class:'bar'},h('i',{id:'splashBar'})),
    h('div',{class:'status',id:'splashStatus'},'Инициализация...')
  ));
  var statuses=['Инициализация...','Подключение Supabase...','Загрузка данных...','Готово'];
  var prog=0;
  var iv=setInterval(function(){
    prog+=25;if(prog>100)prog=100;
    var bar=$('#splashBar');if(bar)bar.style.width=prog+'%';
    var st=$('#splashStatus');if(st)st.textContent=statuses[Math.min(statuses.length-1,Math.floor(prog/26))];
    if(prog>=100){clearInterval(iv);setTimeout(finishSplash,300)}
  },250);
}
function finishSplash(){
  initSupabase();
  initSW();
  genPredictions();
  setInterval(tickTelemetry,5000);
  setInterval(backgroundSync,12000);
  if(sbOk){
    try{
      sb.auth.getSession().then(function(sess){
        if(sess.data.session){loadProfile(sess.data.session.user.id).then(function(){subscribeAll()})}
        else render();
      }).catch(function(){render()});
    }catch(e){render()}
  }else render();
}
renderSplash();
